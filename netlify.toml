[build]
  command = "npm run build:web"
  publish = "dist"

[[redirects]]
  from = "/how-it-works"
  to = "/combined-events-explained"
  status = 301

[[redirects]]
  from = "/support.html"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/privacy.html"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

